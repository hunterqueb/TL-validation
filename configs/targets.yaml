# Target objects and windows. period_sec is filled by scripts/build_real_dataset.py
# from the mean motion of the first TLE.
dt: 60

targets:
  primary:
    name: Yamal 202
    norad: 28089                 # COSPAR 2003-053A
    why: >
      GEO comsat, launched 2003-11-24. Inclination has drifted to 6.57 deg, so north-south
      station keeping stopped long ago; B* is fitted as 0 (no drag at 35 800 km). VERIFY it
      is not still doing east-west / relocation burns over the chosen window -- a maneuver
      breaks all three branches (the ISS case below).
    period_sec: null             # ~86166 s (1436.1 min) expected from the 2026-09-17 TLE
    # Picked by scripts/screen_window.py over 2026-01-01..2026-09-21, before any model
    # ran: 124 TLEs, max gap 19.0 h, max |d(sma)| 0.068 km.
    window:
      start: "2026-02-18"
      stop: "2026-04-08"
      max_ap: null
      confirmed: true            # Hunter confirmed 2026-09-21
  secondary: null                # was a LEO rocket body to stress drag; open question
                                 # now that the primary is GEO
  contaminated:                  # only to show a maneuver breaks all three branches
    name: ISS
    norad: 25544
    use_for_headline: false

# 5 periods at GEO is 4.99 days, so the ASC-style and 7-day windows now nearly coincide.
windows:
  # 1 training period + 5 test periods
  asc:   {minutes: 8620,  n_windows: 8}    # 6 orbital periods (period 1436.09 min)
  long:  {minutes: 10080, n_windows: 4}    # 7 days = 7.02 periods
