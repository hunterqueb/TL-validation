# Branch (a) zero-shot OOD: train on matched synthetic, evaluate on real with NO training.
# This is the ASC 2025 procedure as it actually runs (HANDOFF F1).
branch: a
source: {kind: synthetic, orbit: geo, minutes: 7181, n_sys: 10, index: 0, train_periods: 1}
target: {kind: real, train_periods: 0}     # no target training
epochs_src: 5
epochs_tgt: 0
tl_mode: none
lr: 0.001
batch_size: 8
lookback: 1
loss: huber
models:
  mamba: {d_model: 6, n_layers: 1, d_conv: 4}
  lstm:  {hidden: 30, layers: 1, dropout: 0}
seeds: [0, 1, 2]
