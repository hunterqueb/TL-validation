# Matched synthetic source domain for Yamal 202 (NORAD 28089) -- ASC-style window.
# Copy to GMAT-Thrust-Data/config.yaml and run ./generateGMATNoThrustDataset.sh
#   -> data/regression/geo/8620min-10/statesArrayNoThrust.npz
# which is what configs/branch_a.yaml and configs/branch_c.yaml load as their source.
#
# Elements are the osculating J2000 elements of Yamal 202 at the 2026-09-17 TLE epoch
# (SGP4 state -> TEME->J2000 -> qutils.orbital.ECI2OE):
#   SMA 42165.889 km  ECC 0.000484  INC 6.7000  RAAN 70.0404  AOP 119.4929  MA 57.9959 deg
#
# SMA is not a config key. The generator builds it as r_p/(1-e) with r_p = R + lowerAlt
# and R = 6378 km, so pinning the periapsis altitude pins SMA: at the true eccentricity
# it comes out at 42165.9 km, and across the sampled e in [0, 0.000484) it spans ~20 km.
# That 20 km is the effective SMA spread for runs 1..9 (the plan asked for 5 km).

orbit_type: geo
numMinsToProp: 8620     # 6 orbital periods (period 1436.09 min); dt is fixed at 60 s
                        # = 1 training period + the 5-period forecast horizon (REV-02)
num_runs: 10            # run 0 + 9 neighbours; doubles as the P3-02 source bank

lowerAlt: 35767.502     # km, periapsis altitude above R = 6378 km (r_p = 42145.5 km)
upperAlt: 35767.502     # equal to lowerAlt so SMA is pinned, not sampled over a range
eccentricity: 0.000484  # sampled uniform in [0, this) -- see the SMA note above
inclination: 6.7000
inclination_spread: 0.1
RAAN: 70.0404
RAAN_spread: 0.1
argPeriapsis: 119.4929
argPeriapsis_spread: 0.1
trueAnomaly: 57.9959    # this is the mean anomaly; at e = 4.8e-4 the TA-MA difference
trueAnomaly_spread: 0.1 # is ~0.06 deg, below the spread

# Unused by --propType none, but generateSpacecraftThrustOpt.py reads deltaV and
# chemThrust at import time, so they have to be present. Values from the repo example.
deltaV: 0.002
deltaVStd: 0.0
chemThrust: 10
chemThrustStd: 0
elecThrust: 0.1
elecThrustStd: 0
chemThrustMin: 1724     # ~20 % duty cycle of numMinsToProp, as in the example config
elecThrustMin: 6896     # ~80 %
chemPropTimeStd: 0
elecPropTimeStd: 0

# --- NOT READ YET: needs the HANDOFF section 8.1 patch (R2-01/R2-02) -------------
# Without it the epoch stays hardcoded at "20 Jul 2020 12:00:00.000" and the physical
# parameters are sampled at random per run: SRPArea 1-5 m^2, Cr 1.5-2.0, DryMass 50-150 kg.
# At GEO solar radiation pressure is the dominant non-spherical perturbation, so a random
# SRP area means the source domain is NOT matched in the term that matters most (H-7).
# epoch: "17 Sep 2026 05:52:35.000"
# fixedElements: true
# dryMass: 80
# srpArea: 2.5
# Cr: 1.75
# dragArea: 1.8          # meaningless at GEO; Yamal 202's B* is fitted as 0
# Cd: 2.1
